<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serene Escape Unlimited — 本地复刻</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100vw; height: 100vh;
    cursor: crosshair;
    outline: none;
  }
  #hud {
    position: fixed;
    top: 12px; left: 12px;
    max-width: 340px;
    padding: 10px 14px;
    font: 12px/1.6 "Segoe UI", system-ui, sans-serif;
    color: #eee;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    user-select: none;
    pointer-events: none;
  }
  #hud h1 {
    margin: 0 0 4px;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: #ff9ecf;
    text-shadow: 0 0 8px rgba(255, 110, 199, 0.6);
  }
  #hud .keys { color: #9fd8ff; }
  #hud a { color: #7ec9ff; text-decoration: none; pointer-events: auto; }
  #hud a:hover { text-decoration: underline; }
  #hud .credit { color: #999; font-size: 11px; }
  #error {
    position: fixed;
    inset: 0;
    margin: auto;
    width: min(720px, 90vw);
    height: fit-content;
    padding: 16px;
    font: 12px/1.5 Consolas, monospace;
    white-space: pre-wrap;
    color: #ff7b7b;
    background: rgba(20, 0, 0, 0.92);
    border: 1px solid #a33;
    border-radius: 8px;
  }
  #panel {
    position: fixed;
    top: 12px; right: 12px;
    width: 250px;
    font: 12px/1.5 "Segoe UI", system-ui, sans-serif;
    color: #eee;
    background: rgba(0, 0, 0, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    user-select: none;
  }
  #panel-head {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    font-weight: 600;
    color: #ff9ecf;
    cursor: pointer;
  }
  #panel.collapsed #panel-body { display: none; }
  #panel-body {
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 2px 12px 10px;
  }
  .group-title {
    margin: 8px 0 4px;
    font-size: 11px;
    color: #9fd8ff;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    padding-bottom: 2px;
  }
  #panel .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    cursor: pointer;
  }
  #panel .row.col { flex-direction: column; align-items: stretch; gap: 1px; cursor: default; }
  #panel .plabel { display: flex; justify-content: space-between; cursor: default; }
  #panel .plabel b { color: #ffe08a; font-weight: 600; }
  #panel input[type="range"] { width: 100%; accent-color: #ff6ec7; cursor: pointer; }
  #panel input[type="checkbox"] { accent-color: #ff6ec7; }
  #fx-reset {
    margin-top: 8px;
    padding: 4px 10px;
    font: inherit;
    color: #eee;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 5px;
    cursor: pointer;
  }
  #fx-reset:hover { background: rgba(255, 255, 255, 0.22); }
  #rebuild-note { color: #9fe8a8; font-size: 11px; }
  #serene {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
  }
  #peace-score {
    position: absolute;
    top: 16%; left: 7%;
    font-size: 22px;
    letter-spacing: 0.12em;
    color: #fdf3ff;
    text-shadow: 0 0 10px #ff6ec7, 0 0 28px rgba(255, 110, 199, 0.55);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #peace-score b { color: #ffe08a; text-shadow: 0 0 12px rgba(255, 224, 138, 0.8); }
  #peace-score.on { opacity: 0.95; }
  #peace-state {
    font-size: 12px;
    color: #9fd8ff;
    margin-left: 12px;
    letter-spacing: 0.22em;
    text-shadow: 0 0 8px rgba(159, 216, 255, 0.6);
  }
  #peace-bar {
    margin-top: 6px;
    width: 190px;
    height: 3px;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 2px;
    overflow: hidden;
  }
  #peace-bar-fill {
    height: 100%;
    width: 20%;
    background: linear-gradient(90deg, #61d4ff, #ff6ec7);
    border-radius: 2px;
    transition: width 0.6s ease;
  }
  #peace-delta {
    display: inline-block;
    margin-left: 14px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
  }
  #peace-delta.pop {
    animation: peaceDelta 1.8s ease-out forwards;
  }
  @keyframes peaceDelta {
    0%   { opacity: 0; transform: translateY(8px) scale(0.9); }
    18%  { opacity: 1; transform: translateY(0) scale(1.06); }
    70%  { opacity: 0.9; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(0.96); }
  }
  #peace-tip {
    position: absolute;
    bottom: 24%;
    width: 100%;
    text-align: center;
    font-size: 24px;
    letter-spacing: 0.28em;
    color: #d8f2ff;
    text-shadow: 0 0 12px #61d4ff, 0 0 34px rgba(97, 212, 255, 0.5);
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  #peace-tip.on { opacity: 0.92; }
  #peace-safe {
    position: absolute;
    top: 38%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    font-weight: 300;
    letter-spacing: 0.14em;
    color: #fffbe8;
    text-shadow: 0 0 16px #ffd27a, 0 0 46px rgba(255, 210, 122, 0.55);
    opacity: 0;
    transition: opacity 1.3s ease;
  }
  #peace-safe.on { opacity: 0.97; }
  #peace-safe-sub {
    font-size: 15px;
    margin-top: 12px;
    letter-spacing: 0.3em;
    color: #cfefff;
    text-shadow: 0 0 10px rgba(127, 220, 255, 0.5);
  }
  #peace-gain {
    position: absolute;
    top: 26%;
    width: 100%;
    text-align: center;
    font-size: 17px;
    letter-spacing: 0.24em;
    color: #eafaff;
    text-shadow: 0 0 10px #7fdcff, 0 0 26px rgba(127, 220, 255, 0.5);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #peace-gain.on { opacity: 0.9; }
</style>
<script src="../embed-bridge.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <h1>SERENE ESCAPE UNLIMITED</h1>
  <div class="keys">← → 呼吸 · A/D 也可以 · 空格 启程 · U 安静一下 · 按住鼠标 慢慢看风景 · 不要急</div>
  <div class="credit">
    本地复刻 · 原作 <a href="https://www.shadertoy.com/view/wtS3W3" target="_blank" rel="noopener">Sunset Drive Unlimited</a>
    © 2019 <a href="https://www.shadertoy.com/user/spolsh" target="_blank" rel="noopener">spolsh (Michal Klos)</a> · CC BY-NC-SA 3.0
    · 安详版文案改编
  </div>
</div>

<div id="serene" aria-hidden="true">
  <div id="peace-score">
    <div>安详值 <b id="peace-num">20</b><span id="peace-state">还在逃离</span><span id="peace-delta"></span></div>
    <div id="peace-bar"><div id="peace-bar-fill"></div></div>
  </div>
  <div id="peace-tip"></div>
  <div id="peace-safe">You are still safe<div id="peace-safe-sub">按 ← → 继续旅程</div></div>
  <div id="peace-gain"></div>
</div>

<pre id="error" hidden></pre>

<script src="music.js"></script>
<script src="runtime.js"></script>
</body>
</html>
